<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="100%" height="100%" style="background-color: #F8F9FA; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#495057" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4A2BC2" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#128937" />
    </marker>
  </defs>

  <!-- Title Header -->
  <g transform="translate(50, 40)">
    <rect width="800" height="75" rx="12" fill="#FFFFFF" stroke="#E9ECEF" filter="url(#shadow)"/>
    <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#212529">AI Welfare Leakage Detection &amp; Citizen Recourse Pipeline</text>
    <text x="400" y="56" text-anchor="middle" font-size="13" font-weight="500" fill="#6C757D">SIH 2026 | Problem Statement: SIH26202 | Closed-Loop Architecture</text>
  </g>

  <!-- SECTION 1: AI Anomaly Detection -->
  <g transform="translate(50, 145)">
    <!-- Section Container -->
    <rect width="800" height="280" rx="16" fill="#F8F6FF" stroke="#4A2BC2" stroke-width="2" filter="url(#shadow)"/>
    <rect x="25" y="-14" width="280" height="28" rx="6" fill="#4A2BC2"/>
    <text x="165" y="5" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">1. AI ANOMALY DETECTION ENGINE</text>

    <!-- Inputs -->
    <g transform="translate(40, 40)">
      <rect width="210" height="70" rx="10" fill="#FFFFFF" stroke="#D0C4F7" stroke-width="1.5"/>
      <text x="105" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#4A2BC2">PFMS / DBT Transactions</text>
      <text x="105" y="50" text-anchor="middle" font-size="11" fill="#6C757D">Disbursement streams &amp; velocity</text>
    </g>

    <g transform="translate(40, 130)">
      <rect width="210" height="70" rx="10" fill="#FFFFFF" stroke="#D0C4F7" stroke-width="1.5"/>
      <text x="105" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#4A2BC2">Vital &amp; Tax Registries</text>
      <text x="105" y="50" text-anchor="middle" font-size="11" fill="#6C757D">Municipal deaths &amp; income slabs</text>
    </g>

    <!-- Connector lines to ML Model -->
    <path d="M 250 75 L 310 120" stroke="#4A2BC2" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>
    <path d="M 250 165 L 310 120" stroke="#4A2BC2" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>

    <!-- ML Core Box -->
    <g transform="translate(320, 70)">
      <rect width="210" height="100" rx="12" fill="#FFFFFF" stroke="#4A2BC2" stroke-width="2" filter="url(#shadow)"/>
      <text x="105" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#212529">Isolation Forest</text>
      <text x="105" y="52" text-anchor="middle" font-size="12" font-weight="600" fill="#4A2BC2">+ Rule Engine</text>
      <text x="105" y="76" text-anchor="middle" font-size="10.5" fill="#6C757D">Unsupervised anomaly scoring</text>
    </g>

    <!-- Connector line to Score -->
    <path d="M 530 120 L 580 120" stroke="#4A2BC2" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>

    <!-- Output Box -->
    <g transform="translate(590, 60)">
      <rect width="170" height="120" rx="10" fill="#FFFFFF" stroke="#D0C4F7" stroke-width="1.5"/>
      <text x="85" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#D32F2F">Risk Score: 0–100</text>
      <rect x="25" y="44" width="120" height="8" rx="4" fill="#E9ECEF"/>
      <rect x="25" y="44" width="95" height="8" rx="4" fill="#D32F2F"/>
      <text x="85" y="72" text-anchor="middle" font-size="11" font-weight="600" fill="#212529">Explainable SHAP</text>
      <text x="85" y="92" text-anchor="middle" font-size="10" fill="#6C757D">Income: +42%</text>
      <text x="85" y="106" text-anchor="middle" font-size="10" fill="#6C757D">Geo Mismatch: +28%</text>
    </g>
  </g>

  <!-- Flow Connector 1 -> 2 -->
  <path d="M 450 425 L 450 480" stroke="#4A2BC2" stroke-width="2.5" stroke-dasharray="6,4" fill="none" marker-end="url(#arrow-purple)"/>
  <rect x="360" y="442" width="180" height="22" rx="4" fill="#EDE9FA"/>
  <text x="450" y="457" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4A2BC2">HIGH RISK ANOMALIES</text>

  <!-- SECTION 2: Officer Review & Audit Workflow -->
  <g transform="translate(50, 490)">
    <rect width="800" height="310" rx="16" fill="#FFFBF2" stroke="#C47D00" stroke-width="2" filter="url(#shadow)"/>
    <rect x="25" y="-14" width="290" height="28" rx="6" fill="#C47D00"/>
    <text x="170" y="5" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">2. OFFICER REVIEW &amp; AUDIT WORKFLOW</text>

    <!-- Kanban Board Box -->
    <g transform="translate(40, 35)">
      <rect width="360" height="240" rx="12" fill="#FFFFFF" stroke="#F0DBB0" stroke-width="1.5"/>
      <text x="180" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#C47D00">Kanban Triage Queue (SLA Enforced)</text>
      
      <!-- 3 Columns -->
      <g transform="translate(15, 45)">
        <rect width="100" height="175" rx="6" fill="#FFF8E7" stroke="#E9ECEF"/>
        <text x="50" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#C47D00">Under Review</text>
        <rect x="10" y="32" width="80" height="40" rx="4" fill="#FFFFFF" stroke="#DEE2E6"/>
        <text x="50" y="48" text-anchor="middle" font-size="9.5" font-weight="600" fill="#212529">Case #8402</text>
        <text x="50" y="63" text-anchor="middle" font-size="8.5" fill="#D32F2F">⏱️ 4h Left</text>
      </g>

      <g transform="translate(130, 45)">
        <rect width="100" height="175" rx="6" fill="#FDEEEE" stroke="#E9ECEF"/>
        <text x="50" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#DB372D">Confirmed</text>
        <rect x="10" y="32" width="80" height="40" rx="4" fill="#FFFFFF" stroke="#DEE2E6"/>
        <text x="50" y="48" text-anchor="middle" font-size="9.5" font-weight="600" fill="#212529">Case #8391</text>
        <text x="50" y="63" text-anchor="middle" font-size="8.5" fill="#6C757D">Ghost Claim</text>
      </g>

      <g transform="translate(245, 45)">
        <rect width="100" height="175" rx="6" fill="#E8F5ED" stroke="#E9ECEF"/>
        <text x="50" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#128937">Resolved</text>
        <rect x="10" y="32" width="80" height="40" rx="4" fill="#FFFFFF" stroke="#DEE2E6"/>
        <text x="50" y="48" text-anchor="middle" font-size="9.5" font-weight="600" fill="#212529">Case #8310</text>
        <text x="50" y="63" text-anchor="middle" font-size="8.5" fill="#128937">Recovered</text>
      </g>
    </g>

    <!-- Officer Decision Flow -->
    <g transform="translate(450, 45)">
      <!-- Audit Log Box -->
      <rect width="310" height="85" rx="10" fill="#FFFFFF" stroke="#F0DBB0" stroke-width="1.5"/>
      <text x="155" y="26" text-anchor="middle" font-size="12.5" font-weight="700" fill="#212529">🛡️ Tamper-Evident Audit Trail</text>
      <text x="155" y="46" text-anchor="middle" font-size="10.5" fill="#6C757D">Actor ID • IP Address • Action • Timestamp</text>
      <text x="155" y="65" text-anchor="middle" font-size="10.5" font-weight="600" fill="#4A2BC2">RS256 JWT &amp; Role-Based Access (Admin/Officer)</text>

      <!-- Action Outcomes -->
      <g transform="translate(0, 110)">
        <rect width="145" height="120" rx="10" fill="#FFFFFF" stroke="#DB372D" stroke-width="1.5"/>
        <text x="72.5" y="30" text-anchor="middle" font-size="12" font-weight="700" fill="#DB372D">Confirmed Fraud</text>
        <text x="72.5" y="55" text-anchor="middle" font-size="10" fill="#212529">• Freeze Disbursal</text>
        <text x="72.5" y="75" text-anchor="middle" font-size="10" fill="#212529">• Recovery Notice</text>
        <text x="72.5" y="95" text-anchor="middle" font-size="10" fill="#212529">• De-link Account</text>
      </g>

      <g transform="translate(165, 110)">
        <rect width="145" height="120" rx="10" fill="#FFFFFF" stroke="#128937" stroke-width="1.5"/>
        <text x="72.5" y="30" text-anchor="middle" font-size="12" font-weight="700" fill="#128937">Legitimate User</text>
        <text x="72.5" y="55" text-anchor="middle" font-size="10" fill="#212529">• Whitelist Flag</text>
        <text x="72.5" y="75" text-anchor="middle" font-size="10" fill="#212529">• Release Payments</text>
        <text x="72.5" y="95" text-anchor="middle" font-size="10" fill="#212529">• Retrain Weights</text>
      </g>
    </g>
  </g>

  <!-- Flow Connector 2 <-> 3 (Bi-directional Loop) -->
  <path d="M 380 800 L 380 850" stroke="#128937" stroke-width="2.5" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M 520 850 L 520 805" stroke="#C47D00" stroke-width="2.5" stroke-dasharray="6,4" fill="none" marker-end="url(#arrow)"/>
  <rect x="270" y="813" width="180" height="22" rx="4" fill="#E8F5ED"/>
  <text x="360" y="828" text-anchor="middle" font-size="10.5" font-weight="700" fill="#128937">APPEAL / PROOF UPLOAD</text>
  <rect x="460" y="813" width="180" height="22" rx="4" fill="#FFF8E7"/>
  <text x="550" y="828" text-anchor="middle" font-size="10.5" font-weight="700" fill="#C47D00">REAL-TIME STATUS SYNC</text>

  <!-- SECTION 3: Citizen Recourse & Grievance Loop -->
  <g transform="translate(50, 860)">
    <rect width="800" height="280" rx="16" fill="#F2FAF5" stroke="#128937" stroke-width="2" filter="url(#shadow)"/>
    <rect x="25" y="-14" width="310" height="28" rx="6" fill="#128937"/>
    <text x="180" y="5" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">3. CITIZEN RECOURSE &amp; GRIEVANCE LOOP</text>

    <!-- Citizen Access Channels -->
    <g transform="translate(40, 45)">
      <rect width="210" height="195" rx="12" fill="#FFFFFF" stroke="#B8E6C7" stroke-width="1.5"/>
      <text x="105" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#128937">Access Channels</text>
      <text x="105" y="60" text-anchor="middle" font-size="11.5" font-weight="600" fill="#212529">📱 Mobile Citizen Portal</text>
      <text x="105" y="80" text-anchor="middle" font-size="10.5" fill="#6C757D">No registration needed</text>
      <text x="105" y="115" text-anchor="middle" font-size="11.5" font-weight="600" fill="#212529">🏢 CSC / VLE Kiosks</text>
      <text x="105" y="135" text-anchor="middle" font-size="10.5" fill="#6C757D">Assisted rural filing</text>
      <rect x="20" y="155" width="170" height="25" rx="4" fill="#E8F5ED"/>
      <text x="105" y="172" text-anchor="middle" font-size="10" font-weight="700" fill="#128937">🔒 DPDP Act Compliant</text>
    </g>

    <!-- 4-Step Grievance Wizard -->
    <g transform="translate(280, 45)">
      <rect width="240" height="195" rx="12" fill="#FFFFFF" stroke="#B8E6C7" stroke-width="1.5"/>
      <text x="120" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#212529">Grievance Submission Flow</text>
      <text x="25" y="65" font-size="11" font-weight="600" fill="#128937">1. Scheme &amp; Issue Picker</text>
      <text x="37" y="80" font-size="9.5" fill="#6C757D">PM-KISAN, Pension, Ration</text>
      <text x="25" y="105" font-size="11" font-weight="600" fill="#128937">2. Masked Aadhaar Last-4</text>
      <text x="37" y="120" font-size="9.5" fill="#6C757D">Zero full biometric leakage</text>
      <text x="25" y="145" font-size="11" font-weight="600" fill="#128937">3. Proof Document Upload</text>
      <text x="37" y="160" font-size="9.5" fill="#6C757D">Land records, bank passbook</text>
      <text x="25" y="185" font-size="11" font-weight="600" fill="#128937">4. Mobile OTP Verification</text>
    </g>

    <!-- Tracking Timeline -->
    <g transform="translate(550, 45)">
      <rect width="210" height="195" rx="12" fill="#FFFFFF" stroke="#B8E6C7" stroke-width="1.5"/>
      <text x="105" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#212529">Live Status Tracker</text>
      <text x="105" y="52" text-anchor="middle" font-size="10.5" font-weight="600" fill="#4A2BC2">ID: GRV-2026-8921</text>
      
      <!-- Stepper -->
      <circle cx="35" cy="80" r="7" fill="#128937"/>
      <text x="50" y="84" font-size="10.5" font-weight="600" fill="#212529">Submitted</text>
      <line x1="35" y1="87" x2="35" y2="113" stroke="#128937" stroke-width="2"/>

      <circle cx="35" cy="120" r="7" fill="#C47D00"/>
      <text x="50" y="124" font-size="10.5" font-weight="600" fill="#212529">Under Review (SLA)</text>
      <line x1="35" y1="127" x2="35" y2="153" stroke="#CED4DA" stroke-width="2"/>

      <circle cx="35" cy="160" r="7" fill="#CED4DA"/>
      <text x="50" y="164" font-size="10.5" font-weight="600" fill="#ADB5BD">Resolved &amp; SMS Sent</text>
    </g>
  </g>
</svg>
